[platformio]
default_envs = uno_cpu, uno_small, uno_large, esp32

[env]
lib_deps = symlink://../..

[env:uno_cpu]
platform = atmelavr
board = uno
framework = arduino
build_flags = -DCRC_TABLE_SIZE=0

[env:uno_small]
extends = env:uno_cpu
build_flags = -DCRC_TABLE_SIZE=16

[env:uno_large]
extends = env:uno_cpu
build_flags = -DCRC_TABLE_SIZE=256

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -DCRC_TABLE_SIZE=256

[env:native]
platform = native
build_flags = -std=c++11
